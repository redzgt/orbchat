<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Room Chat</title>
  <style>
    body { font: 16px system-ui; max-width: 620px; margin: 35px auto; padding: 0 16px; }
    input, button { font: inherit; padding: 9px; margin: 4px 0; }
    input { box-sizing: border-box; width: 100%; }
    #messages { height: 300px; overflow: auto; border: 1px solid #ccc; padding: 10px; }
    #chat { display: none; }
    .system { color: #666; font-style: italic; }
  </style>
</head>
<body>
  <h1>Room Chat</h1>
  <label for="name">Your name</label>
  <input id="name" maxlength="24" placeholder="Name">

  <section id="lobby">
    <button id="create">Create a room</button>
    <p>Or join with a code:</p>
    <input id="code" maxlength="6" placeholder="Room code">
    <button id="join">Join room</button>
  </section>

  <p id="status" role="status"></p>

  <section id="chat">
    <p>Room code to share: <strong id="roomCode"></strong></p>
    <div id="messages" aria-live="polite"></div>
    <form id="send">
      <input id="message" maxlength="500" placeholder="Write a message…" autocomplete="off">
      <button>Send</button>
    </form>
  </section>

  <script>
    const $ = id => document.getElementById(id);
    let socket;

    function showMessage(item, system) {
      const p = document.createElement("p");

      if (system) {
        p.className = "system";
        p.textContent = item.text;
      } else {
        const name = document.createElement("strong");
        name.textContent = item.name + ": ";
        p.append(name, document.createTextNode(item.text));
      }

      $("messages").appendChild(p);
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    function connect(code) {
      const name = $("name").value.trim();
      if (!name) {
        $("status").textContent = "Enter your name first.";
        return;
      }

      $("roomCode").textContent = code;
      $("lobby").style.display = "none";
      $("chat").style.display = "block";

      const url = new URL("/ws", location.href);
      url.protocol = location.protocol === "https:" ? "wss:" : "ws:";
      url.searchParams.set("room", code);
      url.searchParams.set("name", name);

      socket = new WebSocket(url);
      socket.onmessage = event => {
        const data = JSON.parse(event.data);

        if (data.type === "history") {
          for (const item of data.messages) showMessage(item, false);
        } else if (data.type === "system") {
          showMessage(data, true);
        } else if (data.type === "chat") {
          showMessage(data, false);
        }
      };

      socket.onclose = () => {
        $("status").textContent = "Disconnected from the room.";
      };
    }

    $("create").onclick = async () => {
      if (!$("name").value.trim()) {
        $("status").textContent = "Enter your name first.";
        return;
      }

      const response = await fetch("/api/rooms", { method: "POST" });
      const result = await response.json();
      connect(result.code);
    };

    $("join").onclick = () => {
      connect($("code").value.trim().toUpperCase());
    };

    $("send").onsubmit = event => {
      event.preventDefault();
      const input = $("message");

      if (socket && socket.readyState === WebSocket.OPEN && input.value.trim()) {
        socket.send(JSON.stringify({ text: input.value }));
        input.value = "";
      }
    };
  </script>
</body>
</html>
