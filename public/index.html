<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06081f">
  <meta name="color-scheme" content="dark">
  <title>OrbChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      font-family: "Nunito", ui-sans-serif, system-ui, sans-serif;
      color: #f7f8ff;
      background: #06081f;
      font-synthesis: none;
      --page: #06081f;
      --line: #24356f;
      --line-strong: #3653b3;
      --blue: #2563eb;
      --blue-hover: #1d4ed8;
      --blue-bright: #66c2ff;
      --text: #f7f8ff;
      --muted: #aebce8;
      --placeholder: #8c9bc9;
      --danger: #ff9caf;
      --focus: #94d5ff;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    html { min-height: 100%; background: var(--page); }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(24px, 6vw, 72px) clamp(18px, 5vw, 48px);
      background: var(--page);
      caret-color: var(--blue-bright);
    }

    ::selection { background: var(--line-strong); color: white; }

    button, input { font: inherit; }

    .shell {
      width: min(100%, 500px);
    }

    main { width: 100%; }

    label {
      display: block;
      margin-bottom: 6px;
      color: #dce4ff;
      font-size: 12px;
      font-weight: 800;
    }

    input {
      min-width: 0;
      width: 100%;
      height: 48px;
      padding: 0 2px;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      outline: none;
      background: transparent;
      color: var(--text);
      font-size: 15px;
      transition: border-color 150ms ease;
    }

    input::placeholder { color: var(--placeholder); opacity: 1; }
    input:hover { border-color: var(--line-strong); }
    input:focus { border-color: var(--focus); }

    .name-field { margin-bottom: 24px; }

    button {
      min-height: 46px;
      border: 0;
      border-radius: 10px;
      background: var(--blue);
      color: white;
      cursor: pointer;
      font-size: 12px;
      font-weight: 800;
      transition: background 150ms ease, transform 150ms ease;
    }

    button:hover { background: var(--blue-hover); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    button:disabled { cursor: wait; background: #24479d; color: #dce4ff; }

    .primary { width: 100%; }

    .divider {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 14px;
      margin: 25px 0 17px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }

    .divider::before, .divider::after {
      height: 1px;
      background: var(--line);
      content: "";
    }

    .join-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 16px;
    }

    .join-row input {
      text-transform: uppercase;
      letter-spacing: .16em;
      font-variant-numeric: tabular-nums;
    }

    .secondary { padding: 0 19px; }

    #status {
      margin: 14px 0 0;
      color: var(--danger);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
    }

    #status:empty { display: none; }
    #room { display: none; }

    .connection-notice {
      margin: 12px 0 0;
      color: var(--danger);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
    }

    .connection-notice:empty { display: none; }

    .roomline { margin-bottom: 18px; }

    .room-code {
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .room-code strong {
      color: var(--blue-bright);
      font-size: 20px;
      font-variant-numeric: tabular-nums;
      letter-spacing: .16em;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    #messages {
      height: min(54vh, 410px);
      min-height: 250px;
      overflow-y: auto;
      padding: 4px 0;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      scrollbar-color: var(--line-strong) transparent;
      scrollbar-width: thin;
    }

    #messages:empty::before {
      display: grid;
      min-height: 100%;
      place-items: center;
      color: var(--placeholder);
      content: "No messages yet";
      font-size: 12px;
      font-weight: 700;
    }

    #messages::-webkit-scrollbar { width: 7px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { border-radius: 999px; background: var(--line-strong); }

    .message {
      margin: 0;
      padding: 13px 2px 14px;
      border-bottom: 1px solid var(--line);
      color: var(--text);
      overflow-wrap: anywhere;
      font-size: 15px;
      line-height: 1.5;
    }

    .message:last-child { border-bottom: 0; }

    .message strong {
      display: block;
      margin-bottom: 2px;
      color: var(--blue-bright);
      font-size: 12px;
      font-weight: 800;
    }

    .message.system {
      padding: 11px 2px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-align: center;
    }

    #send {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 16px;
      margin-top: 14px;
    }

    #send button { padding: 0 20px; }

    @media (max-width: 430px) {
      body { display: block; padding: 42px 20px 24px; }
      .shell { width: 100%; }
      #messages { height: 56vh; min-height: 280px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <!--
    THESIS: Room entry and conversation sit directly on the page; the interface refuses card shells, branded chrome, and repeated status decoration.
    OWN-WORLD: A solid deep-navy canvas, electric-blue actions, Nunito type, open spacing, hairline structure, and no ornamental containers.
    STORY: Name yourself, create or enter a room, then exchange temporary messages with nothing competing for attention.
    FIRST VIEWPORT: One free-standing 500px control column with a name field, solid primary action, divider, and code entry; no heading, logo bar, or card.
    FORM: Distilled compact utility in the brief-pinned Orb Games canon; direction seed ce47812b; code-first.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
  -->
  <div class="shell">
    <main>
      <label for="name">Display name</label>
      <input class="name-field" id="name" maxlength="24" placeholder="How others will see you" autocomplete="nickname">

      <section id="lobby" aria-label="Enter a room">
        <button class="primary" id="create">Create a room</button>
        <div class="divider">or enter a code</div>
        <div class="join-row">
          <input id="code" maxlength="6" placeholder="ABC123" aria-label="Room code" autocomplete="off" spellcheck="false">
          <button class="secondary" id="join">Enter</button>
        </div>
      </section>

      <p id="status" role="status" aria-live="polite"></p>

      <section id="room" aria-label="Room messages">
        <div class="roomline">
          <span class="room-code">Room <strong id="roomCode"></strong></span>
          <span id="connection" class="sr-only" aria-live="polite">Connecting</span>
        </div>
        <div id="messages" aria-live="polite" aria-label="Messages"></div>
        <p id="connectionNotice" class="connection-notice" role="status" aria-live="polite"></p>
        <form id="send">
          <input id="message" maxlength="500" placeholder="Write a message" autocomplete="off" aria-label="Write a message" disabled>
          <button disabled>Send</button>
        </form>
      </section>
    </main>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    let socket;

    function setConnection(label, state) {
      $("connection").textContent = label;
      const connected = state === "connected";
      $("message").disabled = !connected;
      document.querySelector("#send button").disabled = !connected;
      $("connectionNotice").textContent = state === "disconnected"
        ? "Connection lost. Refresh the page to rejoin."
        : "";
    }

    function showMessage(item, system = false) {
      const message = document.createElement("p");
      message.className = system ? "message system" : "message";
      if (system) {
        message.textContent = item.text;
      } else {
        const name = document.createElement("strong");
        name.textContent = item.name;
        message.append(name, document.createTextNode(item.text));
      }
      $("messages").appendChild(message);
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    function connect(code) {
      const name = $("name").value.trim();
      if (!name) {
        $("status").textContent = "Enter a display name first.";
        $("name").focus();
        return;
      }
      if (!/^[A-Z2-9]{6}$/.test(code)) {
        $("status").textContent = "Enter a valid six-character room code.";
        $("code").focus();
        return;
      }

      $("status").textContent = "";
      $("roomCode").textContent = code;
      $("messages").replaceChildren();
      $("name").hidden = true;
      document.querySelector('label[for="name"]').hidden = true;
      $("lobby").hidden = true;
      $("room").style.display = "block";

      const url = new URL("/ws", location.href);
      url.protocol = location.protocol === "https:" ? "wss:" : "ws:";
      url.searchParams.set("room", code);
      url.searchParams.set("name", name);
      socket = new WebSocket(url);
      setConnection("Connecting", "connecting");
      socket.onmessage = event => {
        const data = JSON.parse(event.data);
        if (data.type === "history") {
          for (const item of data.messages) showMessage(item);
        } else if (data.type === "system") {
          showMessage(data, true);
        } else if (data.type === "chat") {
          showMessage(data);
        }
      };
      socket.onerror = () => setConnection("Connection failed", "disconnected");
      socket.onclose = () => setConnection("Disconnected", "disconnected");
      socket.onopen = () => {
        setConnection("Connected", "connected");
        $("message").focus();
      };
    }

    $("create").onclick = async () => {
      if (!$("name").value.trim()) {
        $("status").textContent = "Enter a display name first.";
        $("name").focus();
        return;
      }
      const button = $("create");
      button.disabled = true;
      button.textContent = "Creating room…";
      try {
        const response = await fetch("/api/rooms", { method: "POST" });
        if (!response.ok) throw new Error("Room creation failed");
        const result = await response.json();
        connect(result.code);
      } catch {
        $("status").textContent = "The room could not be created. Try again.";
      } finally {
        button.disabled = false;
        button.textContent = "Create a room";
      }
    };

    $("join").onclick = () => connect($("code").value.trim().toUpperCase());
    $("code").addEventListener("input", event => {
      event.target.value = event.target.value.toUpperCase().replace(/[^A-Z2-9]/g, "");
    });
    $("code").addEventListener("keydown", event => {
      if (event.key === "Enter") connect($("code").value.trim().toUpperCase());
    });
    $("send").onsubmit = event => {
      event.preventDefault();
      const input = $("message");
      if (socket?.readyState === WebSocket.OPEN && input.value.trim()) {
        socket.send(JSON.stringify({ text: input.value }));
        input.value = "";
      }
    };

  </script>
</body>
</html>
