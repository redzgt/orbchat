<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06081f">
  <meta name="color-scheme" content="dark">
  <title>OrbChat</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      font-family: "Nunito", ui-sans-serif, system-ui, sans-serif;
      color: #f7f8ff;
      background: #06081f;
      font-synthesis: none;
      --page: #06081f;
      --surface: #0d1236;
      --surface-raised: #121b4e;
      --field: #080c28;
      --line: #263a8c;
      --line-soft: #1a275f;
      --blue: #2f8dff;
      --blue-bright: #54b8ff;
      --purple: #7766ff;
      --text: #f7f8ff;
      --muted: #aebce8;
      --danger: #ff8fa5;
      --success: #55e0ad;
      --focus: #82c9ff;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { min-height: 100%; background: var(--page); }
    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: clamp(12px, 4vw, 32px);
      background: radial-gradient(circle at 50% -18%, rgba(48, 91, 225, .28), transparent 44%), var(--page);
      caret-color: var(--blue-bright);
    }
    ::selection { background: #3559c9; color: white; }
    button, input { font: inherit; }
    .widget {
      width: min(100%, 460px);
      overflow: hidden;
      border-radius: 16px;
      background: var(--surface);
      box-shadow: 0 22px 52px rgba(0, 0, 0, .34);
    }
    .topbar {
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      padding: 10px 18px;
      background: #111b50;
      border-bottom: 1px solid var(--line-soft);
    }
    .logo-crop { width: 184px; height: 40px; overflow: hidden; flex: none; }
    .logo-crop img {
      display: block;
      width: 184px;
      height: auto;
      transform: translateY(-27px);
      mix-blend-mode: screen;
    }
    .product-state {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: rgba(8, 12, 40, .72);
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
      white-space: nowrap;
    }
    .product-state::before {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--success);
      content: "";
    }
    main { padding: 22px; }
    .intro { margin: 0 0 20px; }
    h1 {
      margin: 0 0 5px;
      color: var(--text);
      font-size: clamp(21px, 5vw, 25px);
      font-weight: 800;
      letter-spacing: -.025em;
      line-height: 1.15;
    }
    .intro p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.5; }
    label {
      display: block;
      margin: 0 0 7px;
      color: #dbe4ff;
      font-size: 12px;
      font-weight: 800;
    }
    input {
      min-width: 0;
      width: 100%;
      height: 44px;
      padding: 0 13px;
      border: 1px solid var(--line-soft);
      border-radius: 12px;
      outline: none;
      background: var(--field);
      color: var(--text);
      font-size: 14px;
      transition: border-color 150ms ease, box-shadow 150ms ease, background 150ms ease;
    }
    input::placeholder { color: #7f8fc3; opacity: 1; }
    input:hover { border-color: var(--line); }
    input:focus { border-color: var(--focus); background: #0a1032; box-shadow: 0 4px 16px rgba(0, 0, 0, .22); }
    .name-field { margin-bottom: 16px; }
    button {
      min-height: 44px;
      border: 0;
      border-radius: 12px;
      cursor: pointer;
      color: white;
      font-size: 13px;
      font-weight: 800;
      transition: transform 150ms ease, filter 150ms ease, background 150ms ease, box-shadow 150ms ease;
    }
    button:hover { filter: brightness(1.1); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    button:disabled { cursor: wait; filter: saturate(.45); opacity: .65; }
    .primary {
      width: 100%;
      background: linear-gradient(115deg, var(--blue), var(--purple));
      box-shadow: 0 7px 20px rgba(0, 0, 0, .25);
    }
    .secondary { padding: 0 17px; background: #294bc2; }
    .join-row { display: flex; gap: 9px; }
    .join-row input { text-transform: uppercase; letter-spacing: .16em; font-variant-numeric: tabular-nums; }
    .divider {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 12px;
      margin: 17px 0;
      color: #91a1d5;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .divider::before, .divider::after { height: 1px; background: var(--line-soft); content: ""; }
    #status { margin: 13px 0 0; color: var(--danger); font-size: 12px; font-weight: 700; line-height: 1.45; }
    #status:empty { display: none; }
    #room { display: none; }
    .roomline { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .room-code {
      display: flex;
      flex-direction: column;
      gap: 2px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 800;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .room-code strong {
      color: var(--blue-bright);
      font-size: 17px;
      font-variant-numeric: tabular-nums;
      letter-spacing: .16em;
    }
    #connection {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      min-height: 28px;
      padding: 0 10px;
      border-radius: 999px;
      background: #090e2e;
      color: var(--muted);
      font-size: 11px;
      font-weight: 800;
    }
    #connection::before { width: 7px; height: 7px; border-radius: 50%; background: #ffbd59; content: ""; }
    #connection[data-state="connected"]::before { background: var(--success); }
    #connection[data-state="disconnected"]::before { background: var(--danger); }
    #messages {
      height: 280px;
      overflow-y: auto;
      padding: 14px;
      border-radius: 14px;
      background: var(--field);
      scrollbar-color: #3554b8 #080c28;
      scrollbar-width: thin;
    }
    #messages:empty::before {
      display: grid;
      min-height: 100%;
      place-items: center;
      color: #8797cb;
      content: "This room is ready.";
      font-size: 12px;
      font-weight: 700;
    }
    #messages::-webkit-scrollbar { width: 8px; }
    #messages::-webkit-scrollbar-track { background: #080c28; }
    #messages::-webkit-scrollbar-thumb { border: 2px solid #080c28; border-radius: 999px; background: #3554b8; }
    .message {
      margin: 0 0 9px;
      padding: 10px 12px;
      border-radius: 12px;
      background: var(--surface-raised);
      color: #eaf0ff;
      overflow-wrap: anywhere;
      font-size: 13px;
      line-height: 1.45;
    }
    .message:last-child { margin-bottom: 0; }
    .message strong { display: block; margin-bottom: 2px; color: var(--blue-bright); font-size: 11px; font-weight: 800; }
    .message.system {
      padding: 3px 8px;
      background: transparent;
      color: #8f9fd2;
      font-size: 11px;
      font-weight: 700;
      text-align: center;
    }
    #send { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 9px; margin-top: 10px; }
    #send button { padding: 0 18px; background: #294bc2; }
    @media (max-width: 430px) {
      body { display: block; padding: 0; background: var(--surface); }
      .widget { width: 100%; min-height: 100vh; border-radius: 0; box-shadow: none; }
      .topbar { padding-inline: 14px; }
      .logo-crop { width: 162px; }
      .logo-crop img { width: 168px; transform: translateY(-24px); }
      .product-state { padding-inline: 8px; font-size: 9px; }
      main { padding: 19px 16px 16px; }
      #messages { height: min(45vh, 340px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <!--
    THESIS: A room opens as quickly as a game; the interface refuses dashboard chrome and keeps one compact path to participation.
    OWN-WORLD: Deep navy surfaces, electric-blue structure, Nunito type, Orb Games' rounded controls, and the supplied OrbChat wordmark.
    STORY: Identify yourself, create or enter a room, share its code, and exchange temporary messages.
    FIRST VIEWPORT: A 460px centered widget with a branded 64px bar, one short introduction, one name field, and two room-entry actions.
    FORM: Compact embedded utility; the brief-pinned Orb Games canon overrides direction roll ce47812b (assigned index 5); code-first.
    FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
  -->
  <div class="widget">
    <header class="topbar">
      <div class="logo-crop"><img src="/logo.png" alt="OrbChat"></div>
      <span class="product-state">Ready</span>
    </header>
    <main>
      <div class="intro" id="intro">
        <h1>Start a private room</h1>
        <p>Create a temporary space, or enter the six-character code someone shared with you.</p>
      </div>
      <label for="name">Display name</label>
      <input class="name-field" id="name" maxlength="24" placeholder="How others will see you" autocomplete="nickname">
      <section id="lobby" aria-label="Enter a room">
        <button class="primary" id="create">Create a room</button>
        <div class="divider">or enter a code</div>
        <div class="join-row">
          <input id="code" maxlength="6" placeholder="ABC123" aria-label="Room code" autocomplete="off" spellcheck="false">
          <button class="secondary" id="join">Enter</button>
        </div>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="room" aria-label="Room messages">
        <div class="roomline">
          <span class="room-code">Room code <strong id="roomCode"></strong></span>
          <span id="connection" aria-live="polite" data-state="connecting">Connecting</span>
        </div>
        <div id="messages" aria-live="polite" aria-label="Messages"></div>
        <form id="send">
          <input id="message" maxlength="500" placeholder="Write a message" autocomplete="off" aria-label="Write a message">
          <button>Send</button>
        </form>
      </section>
    </main>
  </div>
  <script>
    const $ = id => document.getElementById(id);
    let socket;
    function setConnection(label, state) {
      $("connection").textContent = label;
      $("connection").dataset.state = state;
    }
    function showMessage(item, system = false) {
      const message = document.createElement("p");
      message.className = system ? "message system" : "message";
      if (system) {
        message.textContent = item.text;
      } else {
        const name = document.createElement("strong");
        name.textContent = item.name;
        message.append(name, document.createTextNode(item.text));
      }
      $("messages").appendChild(message);
      $("messages").scrollTop = $("messages").scrollHeight;
    }
    function connect(code) {
      const name = $("name").value.trim();
      if (!name) {
        $("status").textContent = "Enter a display name first.";
        $("name").focus();
        return;
      }
      if (!/^[A-Z2-9]{6}$/.test(code)) {
        $("status").textContent = "Enter a valid six-character room code.";
        $("code").focus();
        return;
      }
      $("status").textContent = "";
      $("roomCode").textContent = code;
      $("messages").replaceChildren();
      $("intro").hidden = true;
      $("name").hidden = true;
      document.querySelector('label[for="name"]').hidden = true;
      $("lobby").hidden = true;
      $("room").style.display = "block";
      const url = new URL("/ws", location.href);
      url.protocol = location.protocol === "https:" ? "wss:" : "ws:";
      url.searchParams.set("room", code);
      url.searchParams.set("name", name);
      socket = new WebSocket(url);
      setConnection("Connecting", "connecting");
      socket.onopen = () => setConnection("Connected", "connected");
      socket.onmessage = event => {
        const data = JSON.parse(event.data);
        if (data.type === "history") {
          for (const item of data.messages) showMessage(item);
        } else if (data.type === "system") {
          showMessage(data, true);
        } else if (data.type === "chat") {
          showMessage(data);
        }
      };
      socket.onclose = () => setConnection("Disconnected", "disconnected");
      $("message").focus();
    }
    $("create").onclick = async () => {
      if (!$("name").value.trim()) {
        $("status").textContent = "Enter a display name first.";
        $("name").focus();
        return;
      }
      const button = $("create");
      button.disabled = true;
      button.textContent = "Creating room…";
      try {
        const response = await fetch("/api/rooms", { method: "POST" });
        if (!response.ok) throw new Error("Room creation failed");
        const result = await response.json();
        connect(result.code);
      } catch {
        $("status").textContent = "The room could not be created. Try again.";
      } finally {
        button.disabled = false;
        button.textContent = "Create a room";
      }
    };
    $("join").onclick = () => connect($("code").value.trim().toUpperCase());
    $("code").addEventListener("input", event => {
      event.target.value = event.target.value.toUpperCase().replace(/[^A-Z2-9]/g, "");
    });
    $("code").addEventListener("keydown", event => {
      if (event.key === "Enter") connect($("code").value.trim().toUpperCase());
    });
    $("send").onsubmit = event => {
      event.preventDefault();
      const input = $("message");
      if (socket?.readyState === WebSocket.OPEN && input.value.trim()) {
        socket.send(JSON.stringify({ text: input.value }));
        input.value = "";
      }
    };
  </script>
</body>
</html>
