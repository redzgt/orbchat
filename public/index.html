<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7f5fb">
  <title>OrbChat</title>
  <style>
    :root {
      color-scheme: light;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #24212b;
      background: #f7f5fb;
      font-synthesis: none;
      --purple: #7a2fd0;
      --border: #e8e4ed;
      --muted: #77727f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 14px; }
    .widget { width: min(100%, 440px); overflow: hidden; border: 1px solid var(--border); border-radius: 16px; background: white; box-shadow: 0 8px 28px #34214c0c; }
    header { display: flex; align-items: center; gap: 10px; padding: 17px 19px; border-bottom: 1px solid #f0edf3; }
    .mark { width: 30px; height: 30px; display: grid; place-items: center; border-radius: 10px; background: #f2e9fc; color: var(--purple); font-size: 17px; font-weight: 800; }
    h1 { margin: 0; font-size: 16px; letter-spacing: -.3px; }
    .tagline { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
    main { padding: 19px; }
    label { display: block; margin: 0 0 6px; font-size: 12px; font-weight: 650; }
    input { min-width: 0; width: 100%; height: 40px; padding: 0 11px; border: 1px solid #ded9e5; border-radius: 8px; background: white; color: inherit; font: inherit; font-size: 14px; }
    input::placeholder { color: #aaa5b0; }
    input:focus { outline: 3px solid #7a2fd022; border-color: var(--purple); }
    .name { margin-bottom: 14px; }
    button { min-height: 40px; padding: 0 13px; border: 0; border-radius: 8px; background: var(--purple); color: white; font: inherit; font-size: 13px; font-weight: 650; cursor: pointer; }
    button:hover { background: #6924b9; }
    button:focus-visible { outline: 3px solid #7a2fd055; outline-offset: 2px; }
    .create { width: 100%; }
    .join { display: flex; gap: 8px; }
    .join input { text-transform: uppercase; letter-spacing: 1px; }
    .join button { flex: none; }
    .divider { display: flex; align-items: center; gap: 11px; margin: 16px 0; color: #938d99; font-size: 11px; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #eeeaf1; }
    #status { margin: 11px 0 0; color: #b4334b; font-size: 12px; }
    #status:empty { display: none; }
    #chat { display: none; }
    .roomline { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 12px; font-size: 13px; }
    .roomline strong { color: var(--purple); letter-spacing: 1px; }
    #messages { height: 280px; overflow: auto; padding: 12px; border: 1px solid var(--border); border-radius: 10px; background: #fcfbfd; }
    .message { margin: 0 0 12px; overflow-wrap: anywhere; font-size: 13px; line-height: 1.45; }
    .message:last-child { margin-bottom: 0; }
    .message strong { color: var(--purple); }
    .system { color: var(--muted); font-size: 12px; font-style: italic; }
    #send { display: flex; gap: 8px; margin-top: 10px; }
    #send input { flex: 1; }
    #send button { padding: 0 16px; }
    @media (max-width: 380px) { main { padding: 15px; } header { padding: 14px 15px; } }
  </style>
</head>
<body>
  <div class="widget">
    <header>
      <span class="mark" aria-hidden="true">o</span>
      <div><h1>OrbChat</h1><p class="tagline">A little room for your people.</p></div>
    </header>
    <main>
      <label for="name">Your name</label>
      <input class="name" id="name" maxlength="24" placeholder="Name" autocomplete="nickname">

      <section id="lobby" aria-label="Join a chat room">
        <button class="create" id="create">Create a room</button>
        <div class="divider">or join with a code</div>
        <div class="join">
          <input id="code" maxlength="6" placeholder="ROOM CODE" aria-label="Room code" autocomplete="off">
          <button id="join">Join</button>
        </div>
      </section>

      <p id="status" role="status" aria-live="polite"></p>
      <section id="chat" aria-label="Chat room">
        <div class="roomline"><span>Room code: <strong id="roomCode"></strong></span><span id="connection" aria-live="polite">Connecting…</span></div>
        <div id="messages" aria-live="polite"></div>
        <form id="send">
          <input id="message" maxlength="500" placeholder="Write a message…" autocomplete="off" aria-label="Write a message">
          <button>Send</button>
        </form>
      </section>
    </main>
  </div>
  <script>
    const $ = id => document.getElementById(id);
    let socket;

    function showMessage(item, system = false) {
      const p = document.createElement("p");
      p.className = system ? "message system" : "message";
      if (system) {
        p.textContent = item.text;
      } else {
        const name = document.createElement("strong");
        name.textContent = item.name + ": ";
        p.append(name, document.createTextNode(item.text));
      }
      $("messages").appendChild(p);
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    function connect(code) {
      const name = $("name").value.trim();
      if (!name) {
        $("status").textContent = "Enter your name first.";
        $("name").focus();
        return;
      }
      if (!/^[A-Z2-9]{6}$/.test(code)) {
        $("status").textContent = "Enter a valid six-character room code.";
        $("code").focus();
        return;
      }

      $("status").textContent = "";
      $("roomCode").textContent = code;
      $("messages").replaceChildren();
      $("lobby").style.display = "none";
      $("chat").style.display = "block";

      const url = new URL("/ws", location.href);
      url.protocol = location.protocol === "https:" ? "wss:" : "ws:";
      url.searchParams.set("room", code);
      url.searchParams.set("name", name);
      socket = new WebSocket(url);
      $("connection").textContent = "Connecting…";
      socket.onopen = () => { $("connection").textContent = "Connected"; };
      socket.onmessage = event => {
        const data = JSON.parse(event.data);
        if (data.type === "history") {
          for (const item of data.messages) showMessage(item);
        } else if (data.type === "system") {
          showMessage(data, true);
        } else if (data.type === "chat") {
          showMessage(data);
        }
      };
      socket.onclose = () => { $("connection").textContent = "Disconnected"; };
      $("message").focus();
    }

    $("create").onclick = async () => {
      if (!$("name").value.trim()) {
        $("status").textContent = "Enter your name first.";
        $("name").focus();
        return;
      }
      const button = $("create");
      button.disabled = true;
      try {
        const response = await fetch("/api/rooms", { method: "POST" });
        if (!response.ok) throw new Error("Room creation failed");
        const result = await response.json();
        connect(result.code);
      } catch {
        $("status").textContent = "Could not create a room. Please try again.";
      } finally {
        button.disabled = false;
      }
    };

    $("join").onclick = () => connect($("code").value.trim().toUpperCase());
    $("code").addEventListener("input", event => {
      event.target.value = event.target.value.toUpperCase().replace(/[^A-Z2-9]/g, "");
    });
    $("code").addEventListener("keydown", event => {
      if (event.key === "Enter") connect($("code").value.trim().toUpperCase());
    });
    $("send").onsubmit = event => {
      event.preventDefault();
      const input = $("message");
      if (socket?.readyState === WebSocket.OPEN && input.value.trim()) {
        socket.send(JSON.stringify({ text: input.value }));
        input.value = "";
      }
    };
  </script>
</body>
</html>
