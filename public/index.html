<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#06081f">
  <meta name="color-scheme" content="dark">
  <title>Rooms</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;600;700;800&amp;display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: dark;
      font-family: "Nunito", ui-sans-serif, system-ui, sans-serif;
      color: #f7f8ff;
      background: #06081f;
      font-synthesis: none;
      --page: #06081f;
      --line: #24356f;
      --line-strong: #3653b3;
      --blue: #2563eb;
      --blue-hover: #1d4ed8;
      --blue-bright: #66c2ff;
      --text: #f7f8ff;
      --muted: #aebce8;
      --placeholder: #8c9bc9;
      --danger: #ff9caf;
      --focus: #94d5ff;
      --ink: #050a1e;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { min-height: 100%; background: var(--page); }
    body {
      min-height: 100vh; margin: 0; display: grid; place-items: center;
      padding: 8px clamp(18px, 5vw, 48px) clamp(24px, 6vw, 72px);
      background: var(--page); caret-color: var(--blue-bright);
    }
    ::selection { background: var(--line-strong); color: white; }
    button, input { font: inherit; }
    .shell { width: min(100%, 500px); }
    main { width: 100%; }
    label {
      display: block; margin-bottom: 6px; color: #dce4ff;
      font-size: 12px; font-weight: 800;
    }
    input {
      min-width: 0; width: 100%; height: 48px; padding: 0 2px;
      border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
      outline: none; background: transparent; color: var(--text); font-size: 15px;
      transition: border-color 150ms ease;
    }
    input::placeholder { color: var(--placeholder); opacity: 1; }
    input:hover { border-color: var(--line-strong); }
    input:focus { border-color: var(--focus); }
    .name-field { margin-bottom: 24px; }
    button {
      min-height: 46px; border: 0; border-radius: 10px; background: var(--blue);
      color: white; cursor: pointer; font-size: 12px; font-weight: 800;
      transition: background 150ms ease, transform 150ms ease;
    }
    button:hover { background: var(--blue-hover); }
    button:active { transform: translateY(1px); }
    button:focus-visible { outline: 3px solid var(--focus); outline-offset: 3px; }
    button:disabled { cursor: wait; background: #24479d; color: #dce4ff; }
    .join-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 16px; }
    .join-row input { text-transform: uppercase; letter-spacing: .16em; font-variant-numeric: tabular-nums; }
    .secondary { padding: 0 19px; }
    .create-row { margin-top: 12px; }
    .create-random {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%; min-height: 46px; padding: 0 16px;
    }
    .create-random .icon { display: inline-flex; align-items: center; justify-content: center; font-size: 15px; line-height: 1; }
    #status { margin: 14px 0 0; color: var(--danger); font-size: 12px; font-weight: 700; line-height: 1.45; }
    #status:empty { display: none; }
    #room { display: none; }
    .connection-notice { margin: 12px 0 0; color: var(--danger); font-size: 12px; font-weight: 700; line-height: 1.45; }
    .connection-notice:empty { display: none; }
    .top-bar { margin: 0 0 8px; display: flex; justify-content: flex-start; }
    .leave-room { min-height: 28px; padding: 0 12px; border-radius: 8px; background: transparent; color: var(--muted); font-size: 11px; font-weight: 800; }
    .leave-room:hover { background: rgba(102, 194, 255, 0.08); }
    .roomline { margin-bottom: 18px; }
    .room-code { display: inline-flex; align-items: baseline; gap: 10px; color: var(--muted); font-size: 12px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; }
    .room-code strong { color: var(--blue-bright); font-size: 20px; font-variant-numeric: tabular-nums; letter-spacing: .16em; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0; }
    #messages {
      height: min(54vh, 410px); min-height: 250px; overflow-y: auto; padding: 4px 0;
      border-top: 1px solid var(--line); border-bottom: 1px solid var(--line);
      scrollbar-color: var(--line-strong) transparent; scrollbar-width: thin;
    }
    #messages:empty::before {
      display: grid; min-height: 100%; place-items: center; color: var(--placeholder);
      content: "No messages yet"; font-size: 12px; font-weight: 700;
    }
    #messages::-webkit-scrollbar { width: 7px; }
    #messages::-webkit-scrollbar-track { background: transparent; }
    #messages::-webkit-scrollbar-thumb { border-radius: 999px; background: var(--line-strong); }
    .message {
      margin: 0; padding: 13px 2px 14px; border-bottom: 1px solid var(--line);
      color: var(--text); overflow-wrap: anywhere; font-size: 15px; line-height: 1.5;
    }
    .message:last-child { border-bottom: 0; }
    .message strong {
      display: inline-flex; align-items: center; margin: 0 4px 2px 0;
      color: var(--blue-bright); font-size: 12px; font-weight: 800;
    }
    /* Keep the message body readable; only the sender name gets the dark text treatment. */
    .message.self { color: var(--text); }
    .message.self strong {
      display: inline-flex; align-items: center; padding: 3px 9px;
      border-radius: 999px; background: var(--blue-bright); color: var(--ink);
    }
    .message.system { padding: 11px 2px; color: var(--muted); font-size: 12px; font-weight: 700; text-align: center; }
    #send { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 16px; margin-top: 14px; }
    #send button { padding: 0 20px; }
    @media (max-width: 430px) {
      body { display: block; padding: 12px 20px 24px; }
      .shell { width: 100%; }
      #messages { height: 56vh; min-height: 280px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <main>
      <label for="name">Display name</label>
      <input class="name-field" id="name" maxlength="24" placeholder="How others will see you" autocomplete="nickname">
      <section id="lobby" aria-label="Enter a room">
        <div class="join-row">
          <input id="code" maxlength="4" placeholder="ABCD" aria-label="Room code" autocomplete="off" spellcheck="false">
          <button class="secondary" id="join">Enter</button>
        </div>
        <div class="create-row">
          <button class="create-random" id="create" type="button"><span class="icon">↻</span><span>Create Random ID</span></button>
        </div>
      </section>
      <p id="status" role="status" aria-live="polite"></p>
      <section id="room" aria-label="Room messages">
        <div class="top-bar"><button type="button" class="leave-room" id="leaveRoom">Leave room</button></div>
        <div class="roomline">
          <span class="room-code">Room <strong id="roomCode"></strong></span>
          <span id="connection" class="sr-only" aria-live="polite">Connecting</span>
        </div>
        <div id="messages" aria-live="polite" aria-label="Messages"></div>
        <p id="connectionNotice" class="connection-notice" role="status" aria-live="polite"></p>
        <form id="send">
          <input id="message" maxlength="500" placeholder="Write a message" autocomplete="off" aria-label="Write a message" disabled>
          <button disabled>Send</button>
        </form>
      </section>
    </main>
  </div>
  <script>
    const $ = id => document.getElementById(id);
    const NAME_STORAGE_KEY = "orbchat-last-name";
    let socket;
    let currentName = "";

    function syncCurrentName() {
      currentName = $("name").value.trim();
      if (currentName) localStorage.setItem(NAME_STORAGE_KEY, currentName);
    }

    function setConnection(label, state) {
      $("connection").textContent = label;
      const connected = state === "connected";
      $("message").disabled = !connected;
      document.querySelector("#send button").disabled = !connected;
      $("connectionNotice").textContent = state === "disconnected" ? "Connection lost. Refresh the page to rejoin." : "";
    }

    function showMessage(item, system = false) {
      const message = document.createElement("p");
      message.className = system ? "message system" : "message";
      if (system) {
        message.textContent = item.text;
      } else {
        if (item.name && item.name === currentName) message.classList.add("self");
        const name = document.createElement("strong");
        name.textContent = item.name;
        message.append(name, document.createTextNode(item.text));
      }
      $("messages").appendChild(message);
      $("messages").scrollTop = $("messages").scrollHeight;
    }

    function leaveRoom() {
      if (socket) {
        socket.close();
        socket = null;
      }
      $("room").style.display = "none";
      $("lobby").hidden = false;
      $("name").hidden = false;
      document.querySelector('label[for="name"]').hidden = false;
      $("status").textContent = "";
      $("code").focus();
    }

    function connect(code) {
      const name = $("name").value.trim();
      if (!name) {
        $("status").textContent = "Enter a display name first.";
        $("name").focus();
        return;
      }
      if (!/^[A-Z2-9]{4}$/.test(code)) {
        $("status").textContent = "Enter a valid four-character room code.";
        $("code").focus();
        return;
      }
      syncCurrentName();
      $("status").textContent = "";
      $("roomCode").textContent = code;
      $("messages").replaceChildren();
      $("name").hidden = true;
      document.querySelector('label[for="name"]').hidden = true;
      $("lobby").hidden = true;
      $("room").style.display = "block";
      const url = new URL("/ws", location.href);
      url.protocol = location.protocol === "https:" ? "wss:" : "ws:";
      url.searchParams.set("room", code);
      url.searchParams.set("name", name);
      socket = new WebSocket(url);
      setConnection("Connecting", "connecting");
      socket.onmessage = event => {
        const data = JSON.parse(event.data);
        if (data.type === "history") {
          for (const item of data.messages) showMessage(item);
        } else if (data.type === "system") showMessage(data, true);
        else if (data.type === "chat") showMessage(data);
      };
      socket.onerror = () => setConnection("Connection failed", "disconnected");
      socket.onclose = () => setConnection("Disconnected", "disconnected");
      socket.onopen = () => {
        setConnection("Connected", "connected");
        $("message").focus();
      };
    }

    $("create").onclick = async () => {
      if (!$("name").value.trim()) {
        $("status").textContent = "Enter a display name first.";
        $("name").focus();
        return;
      }
      const button = $("create");
      button.disabled = true;
      button.querySelector("span:last-child").textContent = "Creating…";
      try {
        const response = await fetch("/api/rooms", { method: "POST" });
        if (!response.ok) throw new Error("Room creation failed");
        const result = await response.json();
        connect(result.code);
      } catch {
        $("status").textContent = "The room could not be created. Try again.";
      } finally {
        button.disabled = false;
        button.querySelector("span:last-child").textContent = "Create Random ID";
      }
    };

    $("join").onclick = () => connect($("code").value.trim().toUpperCase());
    $("leaveRoom").onclick = leaveRoom;
    $("code").addEventListener("input", event => {
      event.target.value = event.target.value.toUpperCase().replace(/[^A-Z2-9]/g, "").slice(0, 4);
    });
    $("code").addEventListener("keydown", event => {
      if (event.key === "Enter") connect($("code").value.trim().toUpperCase());
    });
    $("name").addEventListener("input", syncCurrentName);
    $("send").onsubmit = event => {
      event.preventDefault();
      const input = $("message");
      if (socket?.readyState === WebSocket.OPEN && input.value.trim()) {
        socket.send(JSON.stringify({ text: input.value }));
        input.value = "";
      }
    };

    const savedName = localStorage.getItem(NAME_STORAGE_KEY);
    if (savedName) {
      $("name").value = savedName;
      currentName = savedName;
    }
  </script>
</body>
</html>
